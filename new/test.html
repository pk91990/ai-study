<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Study App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mobile-container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: #020617;
      color: white;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      padding: 16px;
      background: #0ea5e9;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
    }

    .content {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .content h2 {
      margin-bottom: 8px;
    }

    .content p {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 25px;
    }

    .action-btn {
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #22c55e;
      color: black;
      font-weight: bold;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .logout-btn {
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #ef4444;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .action-btn:active,
    .logout-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="mobile-container">
    <div class="top-bar">
      AI Study
    </div>

    <div class="content">
      <h2>Welcome Back</h2>
      <p>Continue your smart learning journey.</p>

      <button class="action-btn">Start Learning</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <script>
    function logout() {
      localStorage.clear();
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
